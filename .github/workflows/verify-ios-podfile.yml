name: Verify iOS Podfile Patches

# Runs expo prebuild + pod install on a real macOS machine.
# Does NOT compile with Xcode — just verifies:
#   1. Our config plugin patches apply to the generated Podfile
#   2. pod install succeeds (catches CocoaPods errors before a full EAS build)
#
# Cost: ~5-8 min of macOS runner time per run.

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  verify-podfile:
    runs-on: macos-15        # Xcode 16+, matches EAS build environment
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      # expo prebuild reads googleServicesFile from app.config.js.
      # Without the real plist the @react-native-firebase/app plugin aborts.
      # A structurally valid placeholder is enough for prebuild to complete.
      - name: Create placeholder GoogleService-Info.plist
        run: |
          cat > GoogleService-Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CLIENT_ID</key>
            <string>000000000000-placeholder.apps.googleusercontent.com</string>
            <key>REVERSED_CLIENT_ID</key>
            <string>com.googleusercontent.apps.000000000000-placeholder</string>
            <key>API_KEY</key>
            <string>placeholder-api-key</string>
            <key>GCM_SENDER_ID</key>
            <string>000000000000</string>
            <key>BUNDLE_ID</key>
            <string>com.aareejo.zenvoy</string>
            <key>PROJECT_ID</key>
            <string>placeholder-project</string>
            <key>STORAGE_BUCKET</key>
            <string>placeholder-project.appspot.com</string>
            <key>IS_ADS_ENABLED</key>
            <false/>
            <key>IS_ANALYTICS_ENABLED</key>
            <false/>
            <key>IS_APPINVITE_ENABLED</key>
            <true/>
            <key>IS_GCM_ENABLED</key>
            <true/>
            <key>IS_SIGNIN_ENABLED</key>
            <true/>
            <key>GOOGLE_APP_ID</key>
            <string>1:000000000000:ios:placeholder</string>
          </dict>
          </plist>
          EOF

      - name: Run expo prebuild (iOS only)
        env:
          # Needed so app.config.js evaluates without undefined errors.
          # Actual values are not used during prebuild (only at bundle time).
          EXPO_PUBLIC_CLAUDE_API_KEY: placeholder
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: placeholder
          EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY: placeholder
          EXPO_PUBLIC_REVENUECAT_IOS_API_KEY: placeholder
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Verify Podfile patches are present
        run: |
          echo "=== Generated Podfile patch check ==="
          FAIL=0

          check() {
            if grep -q "$1" ios/Podfile; then
              echo "✓ $2"
            else
              echo "✗ MISSING: $2"
              FAIL=1
            fi
          }

          check "zenvoy:inhibit_all_warnings"          "Patch A marker"
          check "inhibit_all_warnings!"                "inhibit_all_warnings! directive"
          check "zenvoy:firebase_post_install_patches" "Patch B/C marker"
          check "CLANG_ALLOW_NON_MODULAR_INCLUDES"     "Patch B: CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES"
          check "BoringSSL-GRPC"                       "Patch C: BoringSSL-GRPC flag fix"

          if [ $FAIL -ne 0 ]; then
            echo ""
            echo "One or more patches are missing. Printing full Podfile for diagnosis:"
            cat ios/Podfile
            exit 1
          fi

          echo ""
          echo "All patches present. Proceeding to pod install."

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-

      - name: pod install
        run: |
          cd ios
          pod install --repo-update 2>&1
          echo "pod install exit code: $?"

      - name: Print Podfile (always, for reference)
        if: always()
        run: |
          echo "=== ios/Podfile ==="
          cat ios/Podfile
